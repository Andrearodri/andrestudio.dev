name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check patch formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Test public package builder
        run: python3 scripts/build-public.py --self-test

      - name: Build public package
        run: python3 scripts/build-public.py

      - name: Run static lint, typecheck and bundle checks
        run: node scripts/lint-and-typecheck.mjs

      - name: Run security regression checks
        run: node scripts/test-security-fixes.cjs

      - name: Run unit, Edge API and XLSX suites
        run: node --test scripts/test-video-planner.mjs scripts/test-auditor-engine.mjs scripts/test-auditor-edge-and-ui.mjs
