server {
    listen 80;
    server_name feemdeusribamar.duckdns.org;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name feemdeusribamar.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/feemdeusribamar.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feemdeusribamar.duckdns.org/privkey.pem;

    location / {
        return 301 https://borracharia-fe-em-deus.andreaparecidor08.chatgpt.site$request_uri;
    }
}
