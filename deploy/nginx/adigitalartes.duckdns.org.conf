# Nginx configuration for the current EC2/DuckDNS deployment.
# Replace the root path and certificate paths with the active EC2 values before enabling.

server {
    listen 80;
    listen [::]:80;
    server_name adigitalartes.duckdns.org 54.20.49.199;

    return 301 https://adigitalartes.duckdns.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adigitalartes.duckdns.org;

    root /var/www/adigitalartes;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/adigitalartes.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adigitalartes.duckdns.org/privkey.pem;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self), usb=(), xr-spatial-tracking=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' mailto: https://wa.me; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://adigitalartes.duckdns.org; media-src 'self'; connect-src 'self'; frame-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;

    error_page 404 /404.html;

    location = /sobre.html {
        return 301 /sobre/;
    }

    location = /_headers { return 404; }
    location = /_redirects { return 404; }
    location = "/assets/0626 (1).mov" { return 404; }
    location = "/assets/0626 (1).WAV" { return 404; }
    location = "/Design sem nome.png" { return 404; }
    location = "/assets/Inserir um título.png" { return 404; }
    location = "/assets/Inserir um título.svg" { return 404; }

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location ~* \.(?:sql|zip|bak|old|orig|pem|key|p12|pfx)$ {
        return 404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|webp|avif|gif|svg|ico|mp4|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
