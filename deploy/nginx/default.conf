server {
    listen 80;
    server_name adigitalartes.duckdns.org andrestudiodev.duckdns.org;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name adigitalartes.duckdns.org;
    
    ssl_certificate /etc/letsencrypt/live/adigitalartes.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adigitalartes.duckdns.org/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    return 301 https://andrestudiodev.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    server_name andrestudiodev.duckdns.org;
    
    ssl_certificate /etc/letsencrypt/live/andrestudiodev.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andrestudiodev.duckdns.org/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;
    
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
